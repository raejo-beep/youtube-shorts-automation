name: Create YouTube Shorts

on:
  workflow_dispatch:
    inputs:
      count:
        description: Number of private test Shorts to create
        required: false
        default: "1"
  # Daily schedule stays off until the private upload test passes.
  # schedule:
  #   - cron: "0 13 * * *"

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Create Shorts
        env:
          SHORTS_COUNT: ${{ github.event.inputs.count || '1' }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: python generate.py
      - name: Preserve test files
        uses: actions/upload-artifact@v4
        with:
          name: generated-shorts
          path: output/
          retention-days: 7
